[project]
name = "ynab-mcp"
version = "0.1.0"
description = "Local stdio MCP server for YNAB, built directly against YNAB's REST API"
requires-python = ">=3.10"
dependencies = [
    # Pinned to a combination verified working together — the newest
    # fastmcp/pydantic combo breaks this server's tool registration.
    "fastmcp==2.5.1",
    "pydantic==2.11.5",
    "mcp==1.9.1",
    "httpx",
]

[project.scripts]
ynab-mcp = "ynab_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ynab_mcp"]
